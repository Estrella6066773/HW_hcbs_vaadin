spring.datasource.url=jdbc:h2:file:./data/hcbs;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.h2.console.enabled=true
vaadin.launch-browser=false
# Preferred port 8080; if busy, up to 20 hash-based ports in 8081-8280 are tried, then the process exits
server.port=8080

# true = seed when DB is empty on startup; false = use /setup page only
hcbs.test-data.auto-seed-on-startup=true
