# FILE_LOCK=SOCKET: more reliable on Windows and OneDrive than the default file lock
# (Do not combine AUTO_SERVER with DB_CLOSE_ON_EXIT=FALSE — H2 rejects that pair.)
spring.datasource.url=jdbc:h2:file:./data/hcbs;FILE_LOCK=SOCKET;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# DevTools class restart keeps the old JVM holding hcbs.mv.db; disable to avoid file-lock errors
spring.devtools.restart.enabled=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.h2.console.enabled=true
vaadin.launch-browser=false
# Preferred HTTP port (not server.port — that is set after a bind test at startup)
hcbs.server.port.preferred=8080
# Override anytime: mvn spring-boot:run -Dserver.port=9090   or   set SERVER_PORT=9090

# true = seed when DB is empty on startup; false = use /setup page only
hcbs.test-data.auto-seed-on-startup=true
